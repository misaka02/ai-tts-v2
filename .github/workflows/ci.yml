name: CI & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    name: Architecture Guard, Tests, Lint & R8 Release Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Architecture Guard
        run: python scripts/check_architecture.py

      - name: Detekt, Unit Tests & Lint
        run: ./gradlew detekt :core-model:test :core-engine:test :app:testCloudDebugUnitTest :app:lintCloudDebug --no-daemon

      - name: Decode Release Keystore (if configured)
        id: keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.AITTS_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.AITTS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AITTS_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.AITTS_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "Release signing secrets incomplete; APK artifacts will not be uploaded."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ai-tts-release.jks"
          echo "AITTS_KEYSTORE_FILE=$RUNNER_TEMP/ai-tts-release.jks" >> "$GITHUB_ENV"
          echo "AITTS_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "AITTS_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AITTS_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build R8 Release APKs (cloud & full)
        run: ./gradlew assembleR8Release --no-daemon

      - name: Upload R8 Release APK Artifacts
        if: steps.keystore.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aitts-v2-r8-release-apks
          path: app/build/outputs/apk/*/release/*.apk
