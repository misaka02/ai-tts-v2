name: CI & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    name: Architecture Guard, Tests, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Architecture Guard
        run: python scripts/check_architecture.py

      - name: Detekt, Unit Tests & Lint
        run: ./gradlew detekt :core-model:test :core-engine:test :app:testCloudDebugUnitTest :app:lintCloudDebug --no-daemon

      - name: Build Debug APKs (cloud & full)
        run: ./gradlew :app:assembleCloudDebug :app:assembleFullDebug --no-daemon

      - name: Build Release APKs on tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :app:assembleCloudRelease :app:assembleFullRelease --no-daemon

      - name: Prepare Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release_apks
          TAG_NAME=${GITHUB_REF#refs/tags/}
          cp app/build/outputs/apk/cloud/release/*.apk "release_apks/ai-tts-cloud-${TAG_NAME}.apk"
          cp app/build/outputs/apk/full/release/*.apk "release_apks/ai-tts-full-arm64-${TAG_NAME}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_apks/*
          generate_release_notes: true
