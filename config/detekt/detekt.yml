build:
  maxIssues: 0

style:
  MaxLineLength:
    active: true
    maxLineLength: 140
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true
  UnusedPrivateMember:
    active: true
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  WildcardImport:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  ThrowsCount:
    active: false

complexity:
  LongMethod:
    active: true
    threshold: 80
    ignoreAnnotated:
      - Composable
  TooManyFunctions:
    active: true
    thresholdInFiles: 22
    thresholdInClasses: 22
    thresholdInInterfaces: 12
    thresholdInObjects: 22
    ignoreAnnotated:
      - Composable
  CyclomaticComplexMethod:
    active: true
    threshold: 22
    ignoreAnnotated:
      - Composable
  LongParameterList:
    active: false
  NestedBlockDepth:
    active: true
    threshold: 5

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - Composable

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

potential-bugs:
  ImplicitDefaultLocale:
    active: false
